databases:
  - name: chat-db
    databaseName: chat_db
    user: chat_user
    plan: free

services:
  # Backend — .NET 9 API (Docker)
  - type: web
    name: chat-app-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: TokenKey
        sync: false           # Set this manually in the Render dashboard
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: AllowedOrigins
        sync: false           # Set to your frontend URL after deploying frontend

