databases:
  - name: chat-db
    databaseName: chat_db
    user: chat_user
    plan: free

services:
  # Backend — .NET 9 API (Docker)
  - type: web
    name: chat-app-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: TokenKey
        sync: false           # Set this manually in the Render dashboard
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: AllowedOrigins
        sync: false           # Set to your frontend URL after deploying frontend

  # Frontend — Angular static site
  - type: static
    name: chat-app-frontend
    buildCommand: >
      cd frontend &&
      npm install &&
      sed -i "s|__API_URL__|$API_URL|g" src/environments/environment.production.ts &&
      npm run build
    staticPublishPath: frontend/dist/frontend/browser
    envVars:
      - key: API_URL
        sync: false           # Set to your backend URL e.g. https://chat-app-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
